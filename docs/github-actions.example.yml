name: Motion tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-motion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 lua5.4
      - run: make test CXX=g++-14
      - name: Address and undefined behavior sanitizers
        run: |
          g++-14 -std=c++23 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/motion.cpp -o build/motion-sanitized
          ./build/motion-sanitized
